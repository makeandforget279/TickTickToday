; Public TickTickToday defaults.
; Copy this file to ticktick-today.local.ini before customizing it.
; The local file is ignored by Git.
;
; Each setting uses key=value on its own line. Lines starting with ; or # are
; comments. Inline comments are supported; quote values containing ; or #.

[ticktick]
; OAuth redirect URL configured in TickTick Developer.
redirect-uri=http://127.0.0.1:8089/

; Private schedule. Copy periodic-tasks.example.xml to periodic-tasks.xml.
periodic-tasks-file=periodic-tasks.xml

[run]
; Maximum overdue tasks moved per run. Use unlimited for no limit or 0 to list.
move=10

; Maximum number of future days searched for a free slot.
plan-days=60

; Maximum number of past days searched for incomplete tasks.
lookback-days=60

; Number of days populated with periodic tasks. Use 0 to disable creation.
periodic-days=0

; Complete expired tasks carrying #closewhenold.
close-when-old=0

; Force OAuth authorization and ignore the cached token.
login=0

; Safe public default: calculate actions without updating TickTick.
simulate=1

; Validate the INI and periodic schedule, then exit without contacting TickTick.
check-config=0
