name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Validate public configuration
        run: |
          Copy-Item .\periodic-tasks.example.xml .\periodic-tasks.xml
          Copy-Item .\ticktick-today.ini .\ticktick-today.local.ini
          (Get-Content .\ticktick-today.local.ini) -replace '^check-config=0$', 'check-config=1' | Set-Content .\ticktick-today.local.ini
          dotnet run --configuration Release --no-build --project .\TickTickToday.csproj
